name: Build rxdataToJSON (Windows MSVC)

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # CMake is already installed on windows-latest,
      # but we explicitly ensure MSVC env is loaded
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (CMake + MSVC)
        run: >
          cmake
          -S .
          -B build
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: >
          cmake
          --build build
          --config Release

      - name: Show build output
        run: |
          Get-ChildItem -Recurse build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rxdataToJSON-windows-msvc
          path: build/**/rxdataToJSON.exe
