name: Build rxdataToJSON Windows (MinGW)

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install MinGW
      run: choco install mingw -y

    - name: Configure (CMake + MinGW)
      run: cmake -DWITH_AVX2=OFF -DWITH_AVX512=OFF -DWITH_AVX512VNNI=OFF -DWITH_AVX2VNNI=OFF -DWITH_VPCLMULQDQ=OFF -DWITH_PCLMULQDQ=OFF -DWITH_SSE42=OFF -DWITH_SSE41=OFF -DWITH_SSSE3=OFF -DCMAKE_C_FLAGS="-march=x86-64" -DCMAKE_CXX_FLAGS="-march=x86-64 -static -static-libgcc -static-libstdc++" -S . -B build -G "MinGW Makefiles"

    - name: Check compiler and build settings
      run:
        g++ --version
        cmake -LA -N build

    - name: Build
      run: cmake --build build --clean-first --verbose

    - name: Debug build output
      run: Get-ChildItem -Recurse build

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: rxdataToJSON-windows-mingw
        path: build/rxdataToJSON/rxdataToJSON.exe
